<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>ALPHA — núcleo</title>
<style>
  /* Derivado do style.txt do canal, deslocado para violeta.
     Os painéis de HUD do original foram removidos: quem desenha HUD aqui é
     a janela PyQt6 em volta. Sobram a cena 3D + scanlines + vinheta. */
  :root {
    --violet: #b57bff;
    --gold: #ffaa00;
    --magenta: #ff00aa;
    --bg-dark: #050208;
  }

  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background-color: var(--bg-dark);
    overflow: hidden;
    color: white;
    user-select: none;
  }

  canvas {
    display: block;
    width: 100vw; height: 100vh;
    position: absolute; top: 0; left: 0;
    z-index: 1;
  }

  .overlay {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 10;
    background:
      radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
    box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
  }

  #fallback {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    z-index: 20;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(181, 123, 255, 0.55);
    text-align: center;
  }
</style>
</head>
<body>

<div class="overlay"></div>
<div id="fallback">NÚCLEO OFFLINE<br /><span style="font-size:9px;letter-spacing:1px;text-transform:none">sem conexão para carregar o motor 3D</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
try {

const THREE = await import('three');
const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
const { EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js');
const { RenderPass } = await import('three/addons/postprocessing/RenderPass.js');
const { UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js');

const shaderNoise = `
    vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
    vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
    vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
    float snoise(vec3 v) {
        const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
        const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy) );
        vec3 x0 = v - i + dot(i, C.xxx) ;
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min( g.xyz, l.zxy );
        vec3 i2 = max( g.xyz, l.zxy );
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute( permute( permute(
                    i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0 ))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
        float n_ = 0.142857142857;
        vec3  ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_ );
        vec4 x = x_ *ns.x + ns.yyyy;
        vec4 y = y_ *ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4( x.xy, y.xy );
        vec4 b1 = vec4( x.zw, y.zw );
        vec4 s0 = floor(b0)*2.0 + 1.0;
        vec4 s1 = floor(b1)*2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
        vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
        vec3 p0 = vec3(a0.xy,h.x);
        vec3 p1 = vec3(a0.zw,h.y);
        vec3 p2 = vec3(a1.xy,h.z);
        vec3 p3 = vec3(a1.zw,h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
        m = m * m;
        return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
    }
`;

const CONFIG = {
    somaRadius: 4.0,
    dendriteTrees: 14,
    axonTrees: 4,
    maxDistDendrite: 35.0,
    maxDistAxon: 50.0,
    colors: {
        // Paleta ALPHA: o "cyan" do original virou violeta; o azul profundo
        // virou roxo. Dourado e magenta seguem como no style.txt.
        cyan: new THREE.Color('#b57bff'),
        blue: new THREE.Color('#2a1060'),
        gold: new THREE.Color('#ffaa00'),
        orange: new THREE.Color('#ff6a00'),
        magenta: new THREE.Color('#ff00aa'),
        violet: new THREE.Color('#7c3aff')
    }
};

const STATE = { phase: 0, progress: 0, isAnimating: false, mode: 'LISTENING', muted: false };

const uniforms = {
    uTime: { value: 0 },
    uPhase: { value: 0 },
    uProgress: { value: 0 },
    uColCyan: { value: CONFIG.colors.cyan },
    uColBlue: { value: CONFIG.colors.blue },
    uColGold: { value: CONFIG.colors.gold },
    uColOrange: { value: CONFIG.colors.orange },
    uColMagenta: { value: CONFIG.colors.magenta },
    uColViolet: { value: CONFIG.colors.violet },
    uSomaRadius: { value: CONFIG.somaRadius },
    uMaxDistDendrite: { value: CONFIG.maxDistDendrite },
    uMaxDistAxon: { value: CONFIG.maxDistAxon }
};

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x050208, 0.015);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(30, 20, 40);

const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.6, 0.1);
composer.addPass(bloomPass);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.04;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.enablePan = false;
controls.minDistance = 15;
controls.maxDistance = 120;

const somaMaterial = new THREE.ShaderMaterial({
    uniforms: uniforms,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
        ${shaderNoise}
        uniform float uTime;
        uniform int uPhase;
        uniform float uProgress;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying float vNoise;
        void main() {
            vec3 pos = position;
            float noise = snoise(pos * 0.5 + uTime * 0.3) * 0.5;
            float burst = 0.0;
            if(uPhase == 2) { burst = sin(uProgress * 3.14159) * 0.4; }
            pos += normal * (noise + burst);
            vNoise = noise;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
        }
    `,
    fragmentShader: `
        uniform int uPhase;
        uniform float uProgress;
        uniform float uTime;
        uniform vec3 uColCyan;
        uniform vec3 uColBlue;
        uniform vec3 uColGold;
        uniform vec3 uColMagenta;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying float vNoise;
        void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 2.5);
            vec3 color = mix(uColBlue * 0.2, uColCyan, fresnel);
            color += uColCyan * (vNoise * 0.5 + 0.5) * 0.3;
            if(uPhase == 2) {
                float intensity = sin(uProgress * 3.14159);
                color = mix(color, uColGold * 2.0 + uColCyan, intensity * fresnel * 2.0);
                color += uColGold * intensity * (1.0 - fresnel);
            } else if(uPhase == 4) {
                float intensity = 1.0 - uProgress;
                color = mix(color, uColMagenta, intensity * fresnel * 1.5);
            }
            gl_FragColor = vec4(color, 0.8 * fresnel + 0.2);
        }
    `
});

const branchMaterial = new THREE.ShaderMaterial({
    uniforms: Object.assign({}, uniforms, { uIsAxon: { value: 0 } }),
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
        ${shaderNoise}
        uniform float uTime;
        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec2 vUv;
        void main() {
            vUv = uv;
            vec3 pos = position;
            float wiggle = snoise(pos * 0.2 + uTime * 0.5) * 0.1;
            pos += normal * wiggle;
            vec4 worldPosition = modelMatrix * vec4(pos, 1.0);
            vWorldPos = worldPosition.xyz;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = viewMatrix * worldPosition;
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
        }
    `,
    fragmentShader: `
        ${shaderNoise}
        uniform float uTime;
        uniform int uPhase;
        uniform float uProgress;
        uniform int uIsAxon;
        uniform vec3 uColCyan;
        uniform vec3 uColBlue;
        uniform vec3 uColGold;
        uniform vec3 uColOrange;
        uniform vec3 uColMagenta;
        uniform vec3 uColViolet;
        uniform float uSomaRadius;
        uniform float uMaxDistDendrite;
        uniform float uMaxDistAxon;
        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        varying vec2 vUv;
        void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            float edge = pow(1.0 - abs(vUv.y - 0.5) * 2.0, 2.0);
            float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 2.0);
            float dist = length(vWorldPos);
            vec3 baseColor = mix(uColBlue * 0.1, uColCyan * 0.5, fresnel * edge);
            vec3 pulseColor = vec3(0.0);
            float flowNoise = snoise(vec3(vUv.x * 20.0 - uTime * 2.0, vUv.y * 10.0, uTime)) * 0.5 + 0.5;
            float axialFlow = 0.65 + 0.35 * sin(vUv.x * 34.0 - uTime * 8.0);
            if (uIsAxon == 0) {
                if (uPhase == 1) {
                    float currentWaveDist = mix(uMaxDistDendrite, uSomaRadius, uProgress);
                    float head = 1.0 - smoothstep(0.0, 2.3, abs(dist - currentWaveDist));
                    float outerTrail = step(currentWaveDist, dist) * exp(-(dist - currentWaveDist) * 0.18);
                    float mergeGlow = (1.0 - smoothstep(uSomaRadius, uSomaRadius + 8.0, dist)) * smoothstep(0.65, 1.0, uProgress);
                    float pulse = max(head * 1.6, outerTrail * 0.65) + mergeGlow * 0.8;
                    pulseColor = uColGold * pulse * flowNoise * axialFlow * 3.2;
                }
            } else {
                if (uPhase == 3) {
                    float currentWaveDist = mix(uSomaRadius, uMaxDistAxon + 18.0, uProgress);
                    float head = 1.0 - smoothstep(0.0, 3.4, abs(dist - currentWaveDist));
                    float innerTrail = step(dist, currentWaveDist) * exp(-(currentWaveDist - dist) * 0.1);
                    float somaLaunch = (1.0 - smoothstep(uSomaRadius, uSomaRadius + 7.0, dist)) * (1.0 - smoothstep(0.0, 0.28, uProgress));
                    float pulse = max(head * 2.0, innerTrail * 0.9) + somaLaunch * 1.2;
                    pulseColor = (uColOrange + uColGold * 0.45) * pulse * flowNoise * axialFlow * 4.6;
                }
            }
            if (uPhase == 4) {
                float intensity = 1.0 - uProgress;
                pulseColor += uColViolet * intensity * edge * 1.5;
            }
            gl_FragColor = vec4(baseColor + pulseColor, 1.0);
        }
    `
});

const axonMaterial = branchMaterial.clone();
Object.keys(uniforms).forEach((key) => { axonMaterial.uniforms[key] = uniforms[key]; });
axonMaterial.uniforms.uIsAxon = { value: 1 };

const networkGroup = new THREE.Group();
scene.add(networkGroup);

const somaMesh = new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.somaRadius, 32), somaMaterial);
networkGroup.add(somaMesh);

const coreMat = new THREE.MeshBasicMaterial({ color: CONFIG.colors.cyan, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending, wireframe: true });
networkGroup.add(new THREE.Mesh(new THREE.IcosahedronGeometry(CONFIG.somaRadius * 0.8, 16), coreMat));

const synapsePositions = [];
function addSynapse(pos) { synapsePositions.push(pos.x, pos.y, pos.z); }

function buildBranch(startPt, dir, length, radius, level, maxLevels, isAxon) {
    const segments = 12;
    const points = [startPt.clone()];
    let cur = startPt.clone();
    let cDir = dir.clone();
    for (let i = 0; i < segments; i++) {
        let curl = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).multiplyScalar(isAxon ? 0.3 : 0.8);
        cDir.add(curl).normalize();
        cur.add(cDir.clone().multiplyScalar(length / segments));
        points.push(cur.clone());
    }
    const curve = new THREE.CatmullRomCurve3(points);
    const tubeGeo = new THREE.TubeGeometry(curve, segments * 2, radius, 6, false);
    networkGroup.add(new THREE.Mesh(tubeGeo, isAxon ? axonMaterial : branchMaterial));
    if (level < maxLevels) {
        const childCount = isAxon ? (Math.random() > 0.3 ? 1 : 2) : (Math.random() > 0.2 ? 2 : 3);
        for (let j = 0; j < childCount; j++) {
            let splitDir = cDir.clone().add(new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).multiplyScalar(0.8)).normalize();
            buildBranch(cur, splitDir, length * (0.6 + Math.random()*0.3), radius * 0.65, level + 1, maxLevels, isAxon);
        }
    } else {
        addSynapse(cur);
    }
}

for (let i = 0; i < CONFIG.dendriteTrees; i++) {
    let dir = new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize();
    if (dir.z > 0.3) dir.z -= 0.8;
    dir.normalize();
    buildBranch(dir.clone().multiplyScalar(CONFIG.somaRadius - 0.5), dir, 12 + Math.random()*5, 0.4, 0, 2, false);
}
for (let i = 0; i < CONFIG.axonTrees; i++) {
    let dir = new THREE.Vector3((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, 1.0).normalize();
    buildBranch(dir.clone().multiplyScalar(CONFIG.somaRadius - 0.5), dir, 25 + Math.random()*10, 0.6, 0, 2, true);
}

const synGeo = new THREE.BufferGeometry();
synGeo.setAttribute('position', new THREE.Float32BufferAttribute(synapsePositions, 3));
const synSizes = new Float32Array(synapsePositions.length / 3);
for (let i = 0; i < synSizes.length; i++) synSizes[i] = Math.random();
synGeo.setAttribute('aSize', new THREE.BufferAttribute(synSizes, 1));

const synMat = new THREE.ShaderMaterial({
    uniforms: uniforms,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    vertexShader: `
        attribute float aSize;
        uniform float uTime;
        varying float vSize;
        void main() {
            vSize = aSize;
            vec3 pos = position;
            pos.y += sin(uTime * 2.0 + pos.x) * 0.5;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (20.0 + aSize * 15.0) * (100.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    `,
    fragmentShader: `
        uniform int uPhase;
        uniform float uProgress;
        uniform vec3 uColCyan;
        uniform vec3 uColGold;
        uniform vec3 uColMagenta;
        varying float vSize;
        void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            float dist = length(coord);
            if (dist > 0.5) discard;
            float alpha = (0.5 - dist) * 2.0;
            vec3 color = uColCyan * 0.5;
            if (uPhase == 1 || uPhase == 3) {
                float spark = step(0.8, fract(vSize * 10.0 + uProgress * 5.0));
                color = mix(color, uColGold, spark * 2.0);
            } else if (uPhase == 4) {
                color = mix(color, uColMagenta, (1.0 - uProgress));
            }
            gl_FragColor = vec4(color, alpha);
        }
    `
});
networkGroup.add(new THREE.Points(synGeo, synMat));

const dustGeo = new THREE.BufferGeometry();
const dustPos = new Float32Array(800 * 3);
for (let i = 0; i < 800 * 3; i++) dustPos[i] = (Math.random() - 0.5) * 150;
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
    color: CONFIG.colors.cyan, size: 0.2, transparent: true, opacity: 0.3,
    blending: THREE.AdditiveBlending, depthWrite: false
}));
scene.add(dust);

function fireImpulse() {
    if (STATE.isAnimating) return;
    STATE.isAnimating = true;
    STATE.phase = 1;
    STATE.progress = 0;
}

// Ponte com o Python: a janela chama isto a cada mudança de estado do ALPHA.
window.alphaState = function (mode, muted) {
    STATE.mode = mode || 'LISTENING';
    STATE.muted = !!muted;
    controls.autoRotateSpeed = STATE.mode === 'THINKING' ? 2.2 : 0.6;
    if (STATE.mode === 'SPEAKING') fireImpulse();
};

const clock = new THREE.Clock();

function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const time = clock.getElapsedTime();
    uniforms.uTime.value = time;
    controls.update();

    dust.rotation.y = time * 0.02;
    dust.rotation.x = Math.sin(time * 0.01) * 0.05;

    // Falando: dispara impulsos em sequência, o núcleo "pensa alto".
    if (STATE.mode === 'SPEAKING' && !STATE.isAnimating) fireImpulse();

    if (STATE.isAnimating) {
        let speed = 1.0;
        if (STATE.phase === 1) speed = 0.8;
        if (STATE.phase === 2) speed = 2.5;
        if (STATE.phase === 3) speed = 0.95;
        if (STATE.phase === 4) speed = 0.5;
        STATE.progress += dt * speed;
        if (STATE.progress >= 1.0) {
            STATE.progress = 0.0;
            STATE.phase++;
            if (STATE.phase === 2) bloomPass.strength = 2.5;
            if (STATE.phase > 4) { STATE.phase = 0; STATE.isAnimating = false; }
        }
    } else {
        const alvo = STATE.muted ? 0.9 : (STATE.mode === 'THINKING' ? 2.4 : 1.8);
        bloomPass.strength += (alvo - bloomPass.strength) * 0.05;
    }

    uniforms.uPhase.value = STATE.phase;
    uniforms.uProgress.value = STATE.progress;
    composer.render();
}

// O widget Qt muda de tamanho depois que a página carrega, e nem sempre
// dispara `resize` no window. O ResizeObserver no body pega todos os casos.
// (setSize sem o terceiro argumento também atualiza o CSS do canvas — usar
// `false` aqui deixava o canvas preso no tamanho inicial.)
function ajustar() {
    const w = Math.max(1, document.body.clientWidth || window.innerWidth);
    const h = Math.max(1, document.body.clientHeight || window.innerHeight);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    composer.setSize(w, h);
}

window.addEventListener('resize', ajustar);
new ResizeObserver(ajustar).observe(document.body);
ajustar();

animate();

} catch (err) {
    // Sem internet o import do three.js falha: avisa em vez de ficar preto.
    document.getElementById('fallback').style.display = 'flex';
    console.error('[ALPHA] núcleo 3D falhou:', err);
}
</script>
</body>
</html>
